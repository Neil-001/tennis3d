# Final evaluation uses an explicit selected-checkpoint receipt.
# No default checkpoint here establishes a selection or a measured result.
detection:
  device: cpu
  threads: 2
  assets_manifest: configs/assets.yaml
  save_heatmaps: false
  overlay_every: 60
calibration:
  mode: moving
lifting:
  device: cpu
  threads: 2
  model_label: "Final selected EMA; dense real XYZ accuracy unmeasured"
  max_frames: 250
  stride: 125
quality:
  bracketed_gap_s: 0.5
  boundary_gap_s: 0.15
  max_window_disagreement_m: 2.0
  min_height_m: -0.05
  max_height_m: 30.0
  max_speed_m_s: 100.0
